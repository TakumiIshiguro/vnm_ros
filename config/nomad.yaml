seed: 0
device: auto

paths:
  rosbag:
    path: "/home/takumi/bags/sim.bag"
  dataset:
    # train_data_dir: dataset/my_dataset/train
    train_data_dir: dataset/nav/

    # test_data_dir: dataset/nav/

model:
  device: auto
  model_type: nomad
  obs_encoder: efficientnet-b0
  mha_num_attention_heads: 4
  mha_num_attention_layers: 4
  mha_ff_dim_factor: 4
  context_type: temporal
  normalize: false
  waypoint_index: 2
  checkpoint_path: weights/best.pth
  # checkpoint_path: weights/nomad.pth
  encoding_size: 256
  context_size: 3
  image_size: [96, 96]
  len_traj_pred: 8
  learn_angle: false
  cond_predict_scale: false
  down_dims: [64, 128, 256]
  direction_conditioning: true
  direction_num_commands: 3
  direction_latent_dim: 64
  direction_hidden_dim: 64
  num_diffusion_iters: 10
  num_action_samples: 8
  action_noise_scale: 1.0
  action_sample_strategy: mean
  cmd_dir_theta_threshold_deg: 15.0
  action_stats:
    min: [-2.5, -4.0]
    max: [5.0, 4.0]

dataset:
  waypoint_spacing: 1
  cmd_dir_hold_samples_after_change: auto

collection:
  dataset_type: train
  trajectory_name: ""
  pose_source: amcl
  sample_dt: 0.25
  image_format: jpg
  control_rate: 10.0
  nav_path_topic: /move_base/NavfnROS/plan
  nav_cmd_vel_topic: /nav_vel
  vint_cmd_vel_topic: /vnm/cmd_vel_debug
  publish_zero_when_idle: true
  recovery_start_distance: 0.15
  vint_resume_distance: 0.1
  angular_recovery_enabled: true
  angular_recovery_start_error: 0.4
  angular_recovery_resume_error: 0.05
  split_trajectory_on_mode_switch: false
  split_trajectory_on_save_gap: true
  trajectory_save_gap_factor: 1.1
  min_trajectory_samples: auto

training:
  pretrained_weights_path: weights/nomad.pth
  freeze_encoder: false
  use_test: false
  tensorboard: true
  epochs: 10
  batch_size: 64
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  alpha: 0.0
  gradient_clip: 1.0
  scheduler: warmup_cosine
  warmup_epochs: 5
  resume: ""
