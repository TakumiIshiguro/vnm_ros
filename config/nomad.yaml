training:
  model_name: "only_direction"
  pretrained_weights_path: weights/nomad.pth
  freeze_dist_pred_net: true
  freeze_layers:
    - vision_encoder.obs_encoder
    - vision_encoder.goal_encoder
    - vision_encoder.compress_obs_enc
    - vision_encoder.compress_goal_enc
    - vision_encoder.sa_encoder
    - noise_pred_net
  use_test: false
  tensorboard: true
  epoch: [5, 10]
  batch_size: 64
  num_workers: 4
  learning_rate: 0.001
  layer_learning_rates: {}
  weight_decay: 0.0001
  alpha: 0.0
  gradient_clip: 1.0
  cmd_dir_loss_weighting: false
  cmd_dir_loss_weight_power: 1.0
  scheduler: warmup_cosine
  warmup_epochs: 4
  resume: ""

