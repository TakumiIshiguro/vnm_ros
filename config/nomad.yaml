seed: 0
device: auto

paths:
  rosbag:
    path: "/home/takumi/bags/sim_0.8.bag"
  dataset:
    train_data_dir: dataset/nav/
    # train_data_dir: dataset/0.2_3hz/

    # test_data_dir: dataset/nav/

model:
  device: auto
  model_type: nomad
  image_center_crop: false
  obs_encoder: efficientnet-b0
  mha_num_attention_heads: 4
  mha_num_attention_layers: 4
  mha_ff_dim_factor: 4
  context_type: temporal
  normalize: true
  waypoint_index: 2
  # checkpoint_path: weights/nomad.pth
  # checkpoint_path: weights/nomad/nav/epoch040.pth
  # checkpoint_path: weights/nomad/nav/joint_residual_epoch005.pth
  checkpoint_path: weights/nomad/nav/only_direction_epoch005.pth
  # token方式の既存checkpointはresidual方式と互換性がないため使用不可
  encoding_size: 256
  context_size: 3
  image_size: [96, 96]
  len_traj_pred: 8
  learn_angle: false
  cond_predict_scale: false
  down_dims: [64, 128, 256]
  direction_conditioning: true
  direction_conditioning_mode: residual
  # Scale the direction residual before adding it to the NoMaD condition.
  direction_scale: 0.75
  direction_num_commands: 3
  direction_latent_dim: 64
  direction_hidden_dim: 64
  num_diffusion_iters: 10
  num_action_samples: 8
  action_noise_scale: 1.0
  action_sample_strategy: mean
  # action_sample_strategy: cmd_dir
  # action_sample_strategy: first
  cmd_dir_theta_threshold_deg: 15.0
  action_stats:
    min: [-2.5, -4.0]
    max: [5.0, 4.0]

dataset:
  metric_waypoint_spacing: 0.065
  waypoint_spacing: 1
  cmd_dir_hold_samples_after_change: auto

collection:
  dataset_type: train
  trajectory_name: ""
  pose_source: amcl
  sample_dt: 0.25
  image_format: jpg
  control_rate: 20.0
  nav_path_topic: /move_base/NavfnROS/plan
  recovery_start_distance: 0.1
  vint_resume_distance: 0.05
  angular_recovery_error: 0.8
  min_trajectory_samples: auto

