seed: 0
device: auto

paths:
  rosbag:
    path: "/home/takumi/bags/sim_0.8.bag"
  dataset:
    train_data_dir: dataset/bags_all_train/
    test_data_dir: dataset/bags_i_n_test/

model:
  device: auto
  model_type: nomad
  image_center_crop: false
  obs_encoder: efficientnet-b0
  mha_num_attention_heads: 4
  mha_num_attention_layers: 4
  mha_ff_dim_factor: 4
  context_type: temporal
  normalize: true
  waypoint_index: 1
  # Trained on the real bags with the staged freeze -> unfreeze recipe the
  # 2026-09-09 sweep picked for unknown environments, on yaw-offset-corrected
  # labels, plus a mirrored copy of every trajectory. See
  # config/experiments/nomad_real_yawoffset_flip_stage{1,2}.
  #
  # The mirroring: commanded straight, the previous checkpoint steered into
  # side openings -- worst -12.0 deg/s sustained at a_f[2387], against -6.6
  # for the plain-corridor control -- even where its own teacher drove
  # straight through and no right-turn demonstration existed within 13 m.
  # The cause is the course, not the loss: it has only 27 distinct turnable
  # locations and 17 were ever driven under a single command, so the model
  # can fit the data by keying on what a place looks like instead of on the
  # command, and a right opening it learned to turn at elsewhere then pulls
  # it. Mirroring every trajectory (cmd_dir left/right swapped, positions and
  # yaw negated; scripts/augment_dataset_horizontal_flip.py) doubles the
  # distinct-looking locations and makes the two sides symmetric.
  #
  # Measured as the sustained turn rate the model asks for under a straight
  # command -- a 3 s rolling mean of arctan(dy/dx)/dt at waypoint_index, on
  # a_f+g+h. Frames past 3 deg/s fall from 31.3% to 3.7% at the openings and
  # 21.3% to 4.1% on the control, the opening worst case from -12.0 to -5.0,
  # and the right/left asymmetry (-12.0 vs -7.0) closes to -2.9 vs -5.0. The
  # openings are no longer worse than plain corridor. Turning is kept: mean
  # |w| under a turn command goes 12.5 -> 9.9 deg/s left and 10.7 -> 11.2
  # right, with one of 30 left cases losing its sign.
  #
  # Both numbers come from the training set. There is no unseen-area real
  # split anywhere -- a-h is all the real data there is -- so this measures
  # that the model now fits its own teacher where it did not before, not
  # that it generalises better. Single seed.
  #
  # The correction: the direction the robot actually travelled sat about
  # 0.5 deg to the right of the yaw recorded beside it, on every straight in
  # the course, so every teacher trajectory came out rotated by that much and
  # the model learned that going forward means aiming 0.5 deg right. At run
  # time the controller steers to whatever the model asks for -- it never
  # reads /mcl_pose -- so that became a real rightward drift CARE had to keep
  # pushing back against. scripts/fix_yaw_offset.py rotates the labels back;
  # the straight-line drift goes from -16.6 deg per ten seconds to +1.8.
  #
  # Self-information weighting (Imai et al., SICE SI 2025) was tried on top
  # and is not used: weights/nomad/real_yawoffset/real_selfinfo_staged_epoch012.pth,
  # config/experiments/nomad_real_selfinfo_staged_stage{1,2}. It does what
  # the paper says -- it pushes rare sharp turns harder -- but this model
  # was not short of turn, it was short of nothing: at waypoint_index 4 it
  # rotates 3.7x the teacher against this one's 1.97, and drifts +18 deg per
  # ten seconds against +1.8, because the weighting leans to whichever side
  # has the longer tail in the training course.
  #
  # Unfreezing the vision encoder was also tried, in sim where there is a
  # real unseen-area split (config/experiments/nomad_yawfix_unfreeze*). It
  # makes the model markedly more selective about where it turns, but that
  # selectivity is learned over the training course's appearance: on the
  # unseen split one junction with strong floor glare drops from 1.40 of the
  # teacher's rotation to 0.01, a complete failure to turn. The pretrained
  # features handle that junction fine. Frozen stays.
  #
  # On closed-loop trial: the cleaned 2026-10-30 bags alone, no mirroring, no
  # straight exclusion, trained longer: stage 1 80 epochs, stage 2 48, seed 2
  # (config/experiments/nomad_real1030_staged_{stage1,stage2} with the epoch
  # counts changed; nomad_real1030_staged_long_* is the 40 + 24 variant). At
  # 20 + 12 the learned gain was still rising when the schedule ran out; here
  # it ends at 47.4. On real images it halves the left opening pull (1.3 vs
  # 2.4 deg) with straight-road drift still ~0; on sim images it drifts left
  # ~+17 deg per 10 s, so it is meant for the real robot. The previous trial
  # checkpoint was real1030_staged_best.pth (20 + 12); the notes above
  # describe weights/nomad/real_yawoffset_flip/flip_nostraight_s2_best.pth.
  # Closed-loop trial of the 8-point, spacing-3 model (about 1.7 m).
  checkpoint_path: weights/nomad/real1030_yawoffset/real1030_s4_epoch012.pth
  encoding_size: 256
  context_size: 3
  image_size: [96, 96]
  len_traj_pred: 8
  learn_angle: false
  cond_predict_scale: false
  down_dims: [64, 128, 256]
  direction_conditioning: true
  direction_conditioning_mode: residual
  # Normalize the learned command vector, then add a residual whose gain is
  # trained end-to-end. Left free the gain climbs well above its 4.0 init --
  # 20 on the simulator set, 30-42 on the real one -- because the command is
  # close to a location id in these courses: only 8 of the simulator's 22
  # turnable spots, and 10 of the real course's 27, were ever driven under
  # more than one command, so leaning on the command lowers training loss.
  #
  # What that costs is the image. Measured as how hard the model steers back
  # when its context frames are translated sideways, which is what a yaw
  # error looks like, the pretrained NoMaD answers 1.26 deg/s per pixel and
  # crosses zero where it should; at a learned gain of 41.9 that falls to
  # 0.078.
  #
  # Three ways round it were tried on the real set and none worked:
  #
  #   - Fixing the gain. A stage-1 sweep at 4/8/12/16/24/32/36 trades
  #     steering against obedience monotonically (config/experiments/
  #     nomad_flipscale*_stage1). 16 and 24 were each promoted and each
  #     failed in the simulator -- 16 stopped following the command, 24 was
  #     still pulled into side openings. The pull runs opposite to the
  #     sweep: the lower the gain, the harder the model is drawn in, because
  #     the same change that makes it read the image makes it react to the
  #     opening (opening w: -0.400 at 16, -0.159 at 32, -0.066 learned).
  #   - Dropping the plain-corridor straight samples, so the straight
  #     command is represented by the junctions it has to be told apart at
  #     (config/experiments/nomad_flip_nostraight_stage1, three quarters of
  #     the straight samples removed, loss weighting off). The gain still
  #     climbed to 30.9, and the opening pull measured worse, not better:
  #     -0.005 -> -0.064 mean against the same stage-1 baseline. That
  #     checkpoint is nonetheless the current default, on trial in closed
  #     loop -- the offline opening figure has twice now failed to predict
  #     how a checkpoint drives (gains 16 and 24 both looked acceptable and
  #     both failed), so it is not trusted on its own to reject one. Stage 1
  #     only; stage 2 has not been run for it.
  #   - Loss weighting by command frequency, which is what
  #     cmd_dir_loss_weighting already does, and which none of the above
  #     changed the outcome of.
  #
  # None of these adds the missing thing, which is examples of the same
  # place under different commands. Left at the default the gain is learned.
  direction_normalize: true
  direction_scale_learnable: true
  # Starting point only: the trained checkpoint's own gain is stored in its
  # state_dict and overrides this at load time.
  direction_scale: 4.0
  direction_num_commands: 3
  direction_latent_dim: 64
  direction_hidden_dim: 64
  num_diffusion_iters: 10
  num_action_samples: 8
  action_noise_scale: 1.0
  # action_sample_strategy: mean
  action_sample_strategy: cmd_dir
  # action_sample_strategy: first
  cmd_dir_theta_threshold_deg: 15.0
  action_stats:
    min: [-2.5, -4.0]
    max: [5.0, 4.0]

dataset:
  metric_waypoint_spacing: 0.065
  waypoint_spacing: 4
  cmd_dir_hold_samples_after_change: auto

collection:
  dataset_type: train
  trajectory_name: ""
  pose_source: amcl
  sample_dt: 0.25
  image_format: jpg
  control_rate: 20.0
  nav_path_topic: /move_base/NavfnROS/plan
  recovery_start_distance: 0.1
  vint_resume_distance: 0.05
  angular_recovery_error: 0.8
  min_trajectory_samples: auto

training:
  model_name: "no_aug"
  pretrained_weights_path: weights/nomad.pth
  freeze_dist_pred_net: true
  freeze_layers:
    - vision_encoder.obs_encoder
    - vision_encoder.goal_encoder
    - vision_encoder.compress_obs_enc
    - vision_encoder.compress_goal_enc
    - vision_encoder.sa_encoder
  use_test: false
  tensorboard: true
  epoch: [12]
  batch_size: 64
  num_workers: 4
  learning_rate: 0.00002
  layer_learning_rates:
    vision_encoder.direction_encoder: 0.0002
    # The residual gain is a single scalar with no overfitting risk from a
    # fast learning rate; it needs a much larger step size than the
    # direction embedding/projector to actually move away from its init
    # within a short fine-tuning schedule.
    vision_encoder.direction_encoder.raw_scale: 0.05
  # No augmentation, matching corridor_classifier so both packages train the
  # same way.
  #
  # An a-h -> i-n sweep (2026-09-12) compared none / flip / photometric /
  # flip+photometric in both packages. Photometric alone did score best
  # (vnm_ros: +0.59 deg steering separation over none, 16 sigma; corridor:
  # macro F1 0.711 vs 0.693), but every difference was small -- corridor's
  # whole spread was 0.018 macro F1, and vnm_ros's ADE/FDE barely moved -- and
  # all of it came from a single seed. None is the default because it is the
  # simplest thing that is not measurably worse in any way that matters, and
  # because it makes the two packages consistent. Set training.augmentation
  # below (see config/experiments/nomad_aug2_photo) to turn photometric back on.
  weight_decay: 0.0001
  alpha: 0.0
  gradient_clip: 1.0
  cmd_dir_loss_weighting: true
  cmd_dir_loss_weight_power: 0.5
  scheduler: warmup_cosine
  warmup_epochs: 4
  warmup_start_factor: 0.1
  min_lr_factor: 0.1
  resume: ""
