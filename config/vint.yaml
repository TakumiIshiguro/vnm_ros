seed: 0
device: auto

paths:
  rosbag:
    path: "/home/takumi/bags/sim_0.2.bag"
  dataset:
    # train_data_dir: dataset/my_dataset/train
    train_data_dir: dataset/0.2_4hz/

    # test_data_dir: dataset/nav/

model:
  device: auto
  model_type: vint
  obs_encoder: efficientnet-b0
  mha_num_attention_heads: 4
  mha_num_attention_layers: 4
  mha_ff_dim_factor: 4
  context_type: temporal
  normalize: true
  waypoint_index: 1
  checkpoint_path: weights/vint/best.pth
  obs_encoding_size: 512
  late_fusion: false
  context_size: 5
  image_size: [85, 64]
  len_traj_pred: 5
  learn_angle: true
  direction_conditioning: true
  direction_num_commands: 3
  direction_latent_dim: 64
  direction_hidden_dim: 64

dataset:
  image_size: [85, 64]
  metric_waypoint_spacing: 0.06
  waypoint_spacing: 1
  context_size: 5
  len_traj_pred: 5
  normalize: true
  learn_angle: true
  cmd_dir_hold_samples_after_change: auto

collection:
  dataset_type: train
  trajectory_name: ""
  pose_source: amcl
  sample_dt: 0.3
  image_format: jpg
  control_rate: 10.0
  nav_path_topic: /move_base/NavfnROS/plan
  recovery_start_distance: 0.15
  vint_resume_distance: 0.1
  angular_recovery_error: 0.4
  min_trajectory_samples: auto

training:
  pretrained_weights_path: weights/vint.pth
  freeze_layers: []
  use_test: false
  tensorboard: true
  epochs: 100
  epoch_sweep: []
  batch_size: 64
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  alpha: 0.5
  gradient_clip: 1.0
  cmd_dir_loss_weighting: false
  cmd_dir_loss_weight_power: 1.0
  scheduler: warmup_cosine
  warmup_epochs: 10
  resume: ""
